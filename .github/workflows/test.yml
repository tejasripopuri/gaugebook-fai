name: Inspection and report tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gaugebook
          POSTGRES_USER: gaugebook
          POSTGRES_PASSWORD: gaugebook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gaugebook" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://gaugebook:gaugebook@localhost:5432/gaugebook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gaugebook .
